
dataset: "Svarah"

path:
  corpus_path: "./data/English"
  lexicon_path: null
  raw_path: "./data/English"
  preprocessed_path: "./preprocessed_data/English"

preprocessing:
  val_size: 0

  text:
    text_cleaners: []
    language: "English"
    input_type: "phoneme"

  audio:
    sampling_rate: 22050
    max_wav_value: 32768.0

  stft:
    filter_length: 1024
    hop_length: 256
    win_length: 1024

  mel:
    n_mel_channels: 80
    mel_fmin: 0
    mel_fmax: 8000

  pitch:
    feature: "phoneme_level"
    normalization: true

  energy:
    feature: "phoneme_level"
    normalization: true
